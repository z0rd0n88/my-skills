name: zord-skills-check

on:
  pull_request:
    paths:
      - 'skills/zord-*/**'
      - 'scripts/check-zord-skills.sh'
  push:
    branches: [main]
    paths:
      - 'skills/zord-*/**'
      - 'scripts/check-zord-skills.sh'

jobs:
  check:
    name: zord-* skills have -h/--help and stay under the size ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-zord-skills.sh
